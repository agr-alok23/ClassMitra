[versions]
agp = "9.2.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.1"
pdfbox = "2.0.27.0"
guava = "33.6.0-android"
googleServices = "4.4.3"
markwon = "4.6.2"

[libraries]
