                      "error": "#ba1a1a",
                      "on-primary-fixed-variant": "#003ea8",
                      "surface-container-highest": "#e0e3e5",
                      "surface-container-high": "#e6e8ea",

                      "surface-dim": "#d8dadc",
                      "inverse-on-surface": "#eff1f3",

              "fontFamily": {

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 z-0">

</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Brand Header -->
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight mb-2">ClassMitra</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your AI-powered educational companion</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[32px] p-8 shadow-sm border border-surface-variant/30 flex flex-col gap-6">
<div class="flex flex-col gap-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to your account to continue</p>
</div>
<form action="#" class="flex flex-col gap-5" id="loginForm">
<!-- Email Field -->
<div class="group flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-transparent border border-outline rounded-xl focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant font-body-lg text-body-lg" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative">
<input class="w-full h-14 px-4 pr-12 bg-transparent border border-outline rounded-xl focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant font-body-lg text-body-lg" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 rounded-full transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end">
<a class="font-label-lg text-label-lg text-primary hover:underline decoration-2 underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-label-lg text-label-lg hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all shadow-md flex items-center justify-center gap-2" type="submit">
                    Login
                </button>
</form>
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-md text-label-md text-outline">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full h-14 border border-outline text-on-surface rounded-xl font-label-lg text-label-lg hover:bg-surface-variant/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Bottom Link -->
<div class="text-center pt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-lg text-label-lg text-primary font-bold hover:underline underline-offset-4" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Decoration/Trust Indicators -->
<div class="mt-12 grid grid-cols-3 gap-4 opacity-60">
<div class="flex flex-col items-center text-center gap-1">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="lock">lock</span>
<span class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Secure</span>
</div>
<div class="flex flex-col items-center text-center gap-1">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="bolt">bolt</span>
<span class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Fast</span>
</div>
<div class="flex flex-col items-center text-center gap-1">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">AI-Driven</span>
</div>
</div>
</main>
<!-- Footer Simple -->
<footer class="absolute bottom-6 w-full text-center px-4">
<p class="font-label-md text-label-md text-outline">© 2024 ClassMitra Inc. All rights reserved.</p>
</footer>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Micro-interaction for button
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Logging in...
            `;

            // Reset after 2s simulation
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }, 2000);
        });
    </script>
</body></html>
