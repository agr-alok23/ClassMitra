<script>
        // Micro-interactions for Dark Mode Toggle (Visual only for this demo)
        const toggle = document.getElementById('darkModeToggle');
        toggle.addEventListener('change', function() {
            if(this.checked) {
                document.documentElement.classList.add('dark');
                // Note: The UI is currently styled for light mode primarily as per instructions
                // But this demonstrates the hook for theme switching
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // Add subtle parallax effect on scroll for profile picture
        window.addEventListener('scroll', () => {
            const scroll = window.pageYOffset;
            const avatar = document.querySelector('.w-32.h-32');
            if(avatar) {
                avatar.style.transform = `translateY(${scroll * 0.1}px)`;
            }
        });
    </script>
