<!-- Contextual FAB Suppression: Not applicable for onboarding -->
<!-- Interactive Layer: Simple JS for hover effect on the illustration -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const bubbles = document.querySelectorAll('.bubble-float div');
            
            bubbles.forEach(bubble => {
                bubble.addEventListener('mouseenter', () => {
                    bubble.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    bubble.style.transform = 'scale(1.1) rotate(5deg)';
                });
                
                bubble.addEventListener('mouseleave', () => {
                    bubble.style.transform = 'scale(1) rotate(0deg)';
                });
            });
        });
    </script>
