<script>
        // Micro-interaction: Progress bar simulation
        let progress = 85;
        const ring = document.querySelector('.upload-progress-ring');
        const percentageText = document.querySelector('.font-title-md.text-primary');
        const progressBar = document.querySelector('.bg-primary.h-full');

        if (ring) {
            const radius = ring.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            
            function setProgress(percent) {
                const offset = circumference - (percent / 100 * circumference);
                ring.style.strokeDashoffset = offset;
                percentageText.innerText = `${Math.round(percent)}%`;
                progressBar.style.width = `${percent}%`;
            }

            // Occasional jitter for "realism"
            setInterval(() => {
                if(progress < 100) {
                    progress += Math.random() * 0.5;
                    if(progress > 100) progress = 100;
                    setProgress(progress);
                }
            }, 2000);
        }
    </script>
