<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background-color: #f7f9fb;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Subtle Pulse Animation for Logo */
        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.95; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-subtle-pulse {
            animation: subtle-pulse 3s ease-in-out infinite;
        }

        /* Smooth Entry Animations */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fade-up 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Circular Loading Pulse */
        @keyframes loader-spin {
            0% { transform: rotate(0deg); stroke-dashoffset: 280; }
            50% { transform: rotate(180deg); stroke-dashoffset: 75; }
            100% { transform: rotate(360deg); stroke-dashoffset: 280; }
        }
        .loader-path {
            stroke-dasharray: 280;
            stroke-dashoffset: 280;
            transform-origin: center;
            animation: loader-spin 2s ease-in-out infinite;
        }

        /* Glassmorphism Overlay */
        .glass-overlay {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>

</div>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        // Simple entry interaction for elements
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-fade-up');
            elements.forEach((el, index) => {
                el.style.animationDelay = `${(index + 1) * 0.15}s`;
            });

            // Simulate loading completion or transition
            // In a real app, this would be tied to asset loading
            setTimeout(() => {
                console.log('ClassMitra Splash: Assets loaded, ready for transition.');
            }, 3000);
        });

        // Atmospheric parallax on mouse move (Desktop only)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 100;
                const moveY = (e.clientY - window.innerHeight / 2) / 100;
                
                const logo = document.querySelector('.animate-subtle-pulse');
                if (logo) {
                    logo.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });
        }
    </script>
