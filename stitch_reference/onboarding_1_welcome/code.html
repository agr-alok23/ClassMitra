<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button');
            const dots = document.querySelectorAll('.rounded-full');
            
            // Subtle hover effect for the main card
            const mainCard = document.querySelector('main');
            mainCard.addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;
                const { left, top, width, height } = mainCard.getBoundingClientRect();
                const x = (clientX - left) / width - 0.5;
                const y = (clientY - top) / height - 0.5;
                
                mainCard.style.transform = `perspective(1000px) rotateY(${x * 2}deg) rotateX(${-y * 2}deg)`;
            });

            mainCard.addEventListener('mouseleave', () => {
                mainCard.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
            });

            // Smooth transition for next button click (simulated)
            nextBtn.addEventListener('click', () => {
                nextBtn.classList.add('scale-90');
                setTimeout(() => {
                    nextBtn.classList.remove('scale-90');
                }, 150);
            });
        });
    </script>
