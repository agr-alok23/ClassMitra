<style>

      0%, 100% { transform: translateY(0px); }

<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center onboarding-gradient px-margin-mobile relative">
<!-- Top-level Navigation (Suppressed for focused onboarding) -->
<!-- Illustration Section: Bento-inspired layout for visual metaphors -->
<div class="relative w-full max-w-md h-80 flex items-center justify-center mb-12">
<!-- Background Ambient Elements -->
<div class="absolute w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<!-- Central Document Card -->
<div class="relative z-10 w-48 h-64 bg-white rounded-xl card-shadow flex flex-col p-4 border border-outline-variant/30 transform -rotate-3 animate-float">
<div class="w-1/2 h-2 bg-surface-variant rounded-full mb-3"></div>

<div class="w-full h-1 bg-surface-variant/40 rounded-full"></div>
<div class="w-2/3 h-1 bg-surface-variant/40 rounded-full"></div>
</div>
<div class="mt-auto flex justify-center">
<span class="material-symbols-outlined text-primary text-4xl opacity-40">description</span>
</div>
</div>
<!-- AI Magic Particles & Interactive Elements -->
<!-- Summary Chip -->
<div class="absolute top-10 right-4 z-20 bg-secondary-container text-on-secondary-container px-4 py-2 rounded-lg card-shadow flex items-center gap-2 animate-float-delayed">

</div>
<!-- Quiz Card -->
<div class="absolute bottom-12 left-2 z-20 bg-white p-3 rounded-xl card-shadow border border-outline-variant/20 flex flex-col gap-2 w-32 animate-float">
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined text-[18px]">quiz</span>
<span class="font-label-md text-label-md">Quiz</span>
</div>
<div class="space-y-1">
<div class="w-full h-1 bg-tertiary/10 rounded-full"></div>
<div class="w-4/5 h-1 bg-tertiary/10 rounded-full"></div>

</div>

<span class="material-symbols-outlined text-2xl mb-2">style</span>

</div>

        Skip
      </button>
<button class="bg-primary hover:bg-primary/90 text-on-primary px-10 py-4 rounded-xl font-label-lg text-label-lg flex items-center gap-2 card-shadow transition-all active:scale-95 group" onclick="handleNext()">
        Next
        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</footer>
<script>
    function handleNext() {
      // Logic for moving to the next onboarding step
      console.log("Navigating to onboarding step 3...");
    }

    // Micro-interaction: Subtle mouse parallax on desktop
    document.addEventListener('mousemove', (e) => {
      if (window.innerWidth > 768) {
        const amount = 20;
        const x = (e.clientX / window.innerWidth - 0.5) * amount;
        const y = (e.clientY / window.innerHeight - 0.5) * amount;
        const illus = document.querySelector('.relative.w-full.max-w-md.h-80');
        if (illus) {
          illus.style.transform = `translate(${x}px, ${y}px)`;
        }
      }
    });
  </script>
